# genes.yml
# Auto-generated by build_genes_yml.py from vault gene notes.
# Per-gene exclude_text overrides are preserved across rebuilds.
# To add custom exclusions, edit the gene entry below and re-run.
#
# Tag strategy:
#   - Gene symbol is always added automatically (no need to list it)
#   - Work type tag is auto-derived from OpenAlex type field
#   - Disease group tags below come from vault pathology/ tags

collections:
  genes_parent: 6 - Genes
search:
  max_results: 25
  recent_max_results: 10
  re_search_interval_weeks: 8
citation_expansion:
  max_seed_papers: 50
  min_co_citations: 1
  max_min_co: 6
  max_hops: 2
  hop2_top_n: 10
default_exclusions_text:
- cancer
- tumor
- tumour
- carcinoma
- metastasis
- oncogene
- oncology
- malignant
- lymphoma
- leukemia
- leukaemia
- sarcoma
- glioma
- melanoma
- adenocarcinoma
- adenoma
- chemotherapy
- radiotherapy
- immunotherapy
- type 2 diabetes
- myocardial infarction
