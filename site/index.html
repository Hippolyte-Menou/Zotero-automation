<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Near-Miss Articles Dashboard</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  color-scheme: light;
  --sidebar-w: 280px;
  --bg: #f8f9fa;
  --surface: #fff;
  --border: #dee2e6;
  --text: #212529;
  --text-secondary: #6c757d;
  --accent: #0d6efd;
  --accent-light: #e7f1ff;
  --badge-score: #f0ad4e;
  --badge-text: #dc3545;
  --badge-mesh: #fd7e14;
  --badge-mention: #6c757d;
  --hover: #e9ecef;
  --table-header-bg: #f8f9fa;
  --table-border: #eee;
  --table-hover: #fafbfc;
  --btn-primary-hover: #0b5ed7;
  --btn-disabled: #6c757d;
}

html.dark {
    color-scheme: dark;
    --bg: #1a1a2e;
    --surface: #16213e;
    --border: #2a2a4a;
    --text: #e0e0e0;
    --text-secondary: #8888a0;
    --accent: #4d8ffa;
    --accent-light: #1e2a4a;
    --badge-score: #d49a3e;
    --badge-text: #c0392b;
    --badge-mesh: #e06a10;
    --badge-mention: #6c6c8a;
    --hover: #1e2a4a;
    --table-header-bg: #1a1a2e;
    --table-border: #2a2a4a;
    --table-hover: #1e2a4a;
    --btn-primary-hover: #3a7ae0;
    --btn-disabled: #4a4a6a;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  font-size: 14px;
}

/* Layout */
.app {
  display: flex;
  min-height: 100vh;
}

/* Sidebar */
.sidebar {
  width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  z-index: 10;
  overflow: hidden;
}
.sidebar-header {
  padding: 16px;
  border-bottom: 1px solid var(--border);
}
.sidebar-header h2 {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 10px;
}
.sidebar-search {
  width: 100%;
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 13px;
  outline: none;
  background: var(--bg);
  color: var(--text);
}
.sidebar-search:focus { border-color: var(--accent); }

.sidebar-tree {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}

.tree-category {
  user-select: none;
}
.tree-category-header {
  display: flex;
  align-items: center;
  padding: 6px 16px;
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
  gap: 6px;
}
.tree-category-header:hover { background: var(--accent-light); }
.tree-category-header .arrow {
  font-size: 10px;
  transition: transform 0.15s;
  width: 12px;
  text-align: center;
}
.tree-category-header .arrow.open { transform: rotate(90deg); }
.tree-category-header .count {
  margin-left: auto;
  font-weight: 400;
  color: var(--text-secondary);
  font-size: 12px;
}

.tree-children { display: none; }
.tree-children.open { display: block; }

.tree-item {
  display: flex;
  align-items: center;
  padding: 4px 16px 4px 34px;
  cursor: pointer;
  font-size: 13px;
  gap: 4px;
}
.tree-item:hover { background: var(--accent-light); }
.tree-item.active {
  background: var(--accent);
  color: #fff;
}
.tree-item .count {
  margin-left: auto;
  color: var(--text-secondary);
  font-size: 12px;
}
.tree-item.active .count { color: rgba(255,255,255,0.7); }

/* A-Z filter for genes */
.az-filter {
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
  padding: 4px 16px 4px 34px;
  margin-bottom: 4px;
}
.az-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 5px;
  font-size: 11px;
  cursor: pointer;
  color: var(--text-secondary);
}
.az-btn:hover, .az-btn.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

/* Main content */
.main {
  flex: 1;
  margin-left: var(--sidebar-w);
  padding: 20px 24px;
}

.main-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 10px;
}
.main-title {
  font-size: 18px;
  font-weight: 600;
}
.main-subtitle {
  color: var(--text-secondary);
  font-size: 13px;
}
.main-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

select, button {
  font-family: inherit;
  font-size: 13px;
}
.filter-select {
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
}
.btn {
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  cursor: pointer;
  font-weight: 500;
}
.btn:hover { background: var(--hover); }
.btn-primary {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.btn-primary:hover { background: var(--btn-primary-hover); }
.btn-primary:disabled {
  background: var(--btn-disabled);
  border-color: var(--btn-disabled);
  cursor: not-allowed;
}

.selection-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-secondary);
}

/* Article table */
.article-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--surface);
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--border);
}
.article-table th {
  padding: 10px 12px;
  text-align: left;
  font-weight: 600;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-secondary);
  border-bottom: 2px solid var(--border);
  background: var(--table-header-bg);
}
.article-table th.sortable {
  cursor: pointer;
  user-select: none;
  position: relative;
  padding-right: 20px;
}
.article-table th.sortable:hover {
  color: var(--accent);
}
.sort-arrow {
  position: absolute;
  right: 4px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 10px;
  opacity: 0.3;
}
.article-table th.sort-active .sort-arrow {
  opacity: 1;
  color: var(--accent);
}
.article-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--table-border);
  vertical-align: top;
}
.article-table tr:last-child td { border-bottom: none; }
.article-table tr:hover td { background: var(--table-hover); }

.article-title a {
  color: var(--text);
  text-decoration: none;
  font-weight: 500;
}
.article-title a:hover { color: var(--accent); text-decoration: underline; }
.article-meta {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 2px;
}

.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 500;
  color: #fff;
  white-space: nowrap;
}
.badge-score { background: var(--badge-score); }
.badge-text { background: var(--badge-text); }
.badge-mesh { background: var(--badge-mesh); }
.badge-mention { background: var(--badge-mention); }
.badge-recurring {
  background: #6f42c1;
  font-size: 10px;
  padding: 1px 6px;
  margin-left: 4px;
  vertical-align: middle;
}
.first-seen {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 2px;
}
.recurring-toggle {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  cursor: pointer;
  user-select: none;
}

.score-detail {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 2px;
}
.matched-term {
  font-size: 12px;
  color: var(--text-secondary);
  font-style: italic;
  margin-top: 2px;
}
.trigger-mark {
  background: rgba(220, 53, 69, 0.18);
  border-radius: 2px;
  padding: 0 1px;
}
html.dark .trigger-mark {
  background: rgba(220, 53, 69, 0.3);
}
.mesh-trigger-tag {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 500;
  background: var(--badge-mesh);
  color: #fff;
  margin-top: 3px;
}

.abstract-toggle {
  font-size: 12px;
  color: var(--accent);
  cursor: pointer;
  background: none;
  border: none;
  padding: 2px 0;
  margin-top: 4px;
}
.abstract-toggle:hover { text-decoration: underline; }
.abstract-text {
  display: none;
  margin-top: 6px;
  padding: 8px;
  background: var(--table-header-bg);
  border-radius: 4px;
  font-size: 12px;
  line-height: 1.6;
  color: var(--text-secondary);
}
.abstract-text.open { display: block; }

.col-check { width: 36px; }
.col-reason { width: 130px; }
.col-score { width: 80px; text-align: right; }
.col-cited { width: 70px; text-align: right; }
.col-year { width: 60px; }

/* Pagination */
.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin-top: 16px;
  padding: 12px 0;
}
.page-btn {
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  cursor: pointer;
  font-size: 13px;
}
.page-btn:hover { background: var(--hover); }
.page-btn.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.page-info {
  font-size: 13px;
  color: var(--text-secondary);
  padding: 0 8px;
}

/* Empty state */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-secondary);
}
.empty-state h3 { font-size: 16px; margin-bottom: 8px; color: var(--text); }

/* Loading state */
.loading {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-secondary);
}

/* Metadata bar */
.meta-bar {
  font-size: 12px;
  color: var(--text-secondary);
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}

/* Threshold tuning panel */
.tuning-panel {
  border-top: 1px solid var(--border);
  padding: 0;
}
.tuning-header {
  display: flex;
  align-items: center;
  padding: 10px 16px;
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
  gap: 6px;
  user-select: none;
}
.tuning-header:hover { background: var(--accent-light); }
.tuning-header .arrow {
  font-size: 10px;
  transition: transform 0.15s;
  width: 12px;
  text-align: center;
}
.tuning-header .arrow.open { transform: rotate(90deg); }
.tuning-body {
  display: none;
  padding: 8px 16px 14px;
}
.tuning-body.open { display: block; }
.tuning-row {
  margin-bottom: 10px;
}
.tuning-label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 4px;
}
.tuning-label strong {
  color: var(--text);
  font-weight: 600;
}
.tuning-slider {
  width: 100%;
  margin: 0;
  accent-color: var(--accent);
}
.tuning-result {
  font-size: 12px;
  padding: 6px 8px;
  background: var(--accent-light);
  border-radius: 4px;
  margin-top: 6px;
  line-height: 1.5;
}
.tuning-result .rescued-count {
  font-weight: 600;
  color: var(--accent);
}
.tuning-reset {
  font-size: 12px;
  color: var(--accent);
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  margin-top: 4px;
}
.tuning-reset:hover { text-decoration: underline; }
.tuning-disabled {
  font-size: 12px;
  color: var(--text-secondary);
  font-style: italic;
  padding: 4px 0;
}

/* Rescued row highlight */
.article-table tr.rescued td {
  background: var(--accent-light);
}
.rescued-badge {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 500;
  background: #198754;
  color: #fff;
  margin-left: 4px;
  vertical-align: middle;
}

/* Rescue queue */
.rescue-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px 8px;
  font-size: 11px;
  cursor: pointer;
  color: var(--text-secondary);
  white-space: nowrap;
}
.rescue-btn:hover {
  background: #198754;
  color: #fff;
  border-color: #198754;
}
.rescue-btn.rescued {
  background: #198754;
  color: #fff;
  border-color: #198754;
  cursor: default;
}
.col-rescue { width: 70px; text-align: center; }
.rescue-export-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: var(--accent-light);
  border-radius: 6px;
  margin-bottom: 12px;
  font-size: 13px;
}
.rescue-export-bar .rescue-count {
  font-weight: 600;
  color: var(--accent);
}

/* Recent additions panel */
.recent-toggle {
  background: none;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px 8px;
  font-size: 12px;
  cursor: pointer;
  color: var(--text-secondary);
  margin-left: 8px;
}
.recent-toggle:hover { background: var(--hover); color: var(--text); }
.recent-toggle.active { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }

.recent-panel {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  border-radius: 6px;
  margin-bottom: 0;
}
.recent-panel.open {
  max-height: 600px;
  margin-bottom: 16px;
  overflow-y: auto;
}
.recent-panel-inner {
  padding: 14px 18px;
}
.recent-group-header {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  padding: 8px 0 4px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 4px;
}
.recent-group-header .recent-group-count {
  font-weight: 400;
  color: var(--text-secondary);
  font-size: 12px;
  margin-left: 6px;
}
.recent-item {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 3px 0;
  font-size: 12px;
}
.recent-item a {
  color: var(--text);
  text-decoration: none;
}
.recent-item a:hover { color: var(--accent); text-decoration: underline; }
.recent-item .recent-meta {
  color: var(--text-secondary);
  font-size: 11px;
  white-space: nowrap;
}
.recent-source-tag {
  display: inline-block;
  padding: 0 5px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 500;
  color: #fff;
  white-space: nowrap;
}
.recent-source-search { background: #0d6efd; }
.recent-source-citation { background: #6f42c1; }
.recent-source-recent { background: #198754; }
.recent-source-rescue { background: #fd7e14; }
.recent-empty {
  text-align: center;
  padding: 20px;
  color: var(--text-secondary);
  font-size: 13px;
}

/* Shared near-misses */
.shared-separator {
  border: none;
  border-top: 1px solid var(--border);
  margin: 4px 16px;
}
.shared-item {
  display: flex;
  align-items: center;
  padding: 6px 16px;
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
  gap: 6px;
}
.shared-item:hover { background: var(--accent-light); }
.shared-item.active {
  background: var(--accent);
  color: #fff;
}
.shared-item .count {
  margin-left: auto;
  font-weight: 400;
  color: var(--text-secondary);
  font-size: 12px;
}
.shared-item.active .count { color: rgba(255,255,255,0.7); }

.sub-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
}
.sub-badge {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 8px;
  font-size: 10px;
  font-weight: 500;
  color: #fff;
  white-space: nowrap;
}
.sub-badge-gene { background: #6f42c1; }
.sub-badge-topic { background: #0d6efd; }
.col-subs { width: 160px; }

/* Stats panel */
.stats-toggle {
  background: none;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px 8px;
  font-size: 12px;
  cursor: pointer;
  color: var(--text-secondary);
  margin-left: 8px;
}
.stats-toggle:hover { background: var(--hover); color: var(--text); }
.stats-toggle.active { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }

.theme-toggle {
  background: none;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px 8px;
  font-size: 12px;
  cursor: pointer;
  color: var(--text-secondary);
  margin-left: 8px;
}
.theme-toggle:hover { background: var(--hover); color: var(--text); }

.stats-panel {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  border-radius: 6px;
  margin-bottom: 0;
}
.stats-panel.open {
  max-height: 400px;
  margin-bottom: 16px;
}
.stats-panel-inner {
  padding: 14px 18px;
}
.stats-grid {
  display: flex;
  gap: 24px;
  align-items: flex-start;
  flex-wrap: wrap;
}
.stats-summary {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 100px;
}
.stats-big-number {
  font-size: 28px;
  font-weight: 700;
  color: var(--text);
  line-height: 1;
}
.stats-label {
  font-size: 12px;
  color: var(--text-secondary);
}
.stats-breakdown {
  flex: 1;
  min-width: 200px;
}
.stats-breakdown-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.stats-bar-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
  font-size: 12px;
}
.stats-bar-label {
  width: 130px;
  text-align: right;
  color: var(--text-secondary);
  flex-shrink: 0;
}
.stats-bar-track {
  flex: 1;
  height: 14px;
  background: var(--bg);
  border-radius: 3px;
  overflow: hidden;
}
.stats-bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.3s ease;
}
.stats-bar-fill.fill-score { background: var(--badge-score); }
.stats-bar-fill.fill-text { background: var(--badge-text); }
.stats-bar-fill.fill-mesh { background: var(--badge-mesh); }
.stats-bar-fill.fill-mention { background: var(--badge-mention); }
.stats-bar-count {
  width: 36px;
  text-align: right;
  color: var(--text);
  font-weight: 500;
  flex-shrink: 0;
}
.stats-top-subs {
  margin-top: 10px;
  border-top: 1px solid var(--border);
  padding-top: 10px;
}
.stats-top-subs-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.stats-sub-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 3px;
  font-size: 12px;
}
.stats-sub-name {
  width: 150px;
  text-align: right;
  color: var(--text);
  flex-shrink: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.stats-sub-bar {
  flex: 1;
  height: 10px;
  background: var(--bg);
  border-radius: 3px;
  overflow: hidden;
}
.stats-sub-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
  opacity: 0.7;
}
.stats-sub-count {
  width: 30px;
  text-align: right;
  color: var(--text-secondary);
  font-size: 11px;
  flex-shrink: 0;
}

/* Run history panel */
.history-toggle {
  background: none;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px 8px;
  font-size: 12px;
  cursor: pointer;
  color: var(--text-secondary);
  margin-left: 8px;
}
.history-toggle:hover { background: var(--hover); color: var(--text); }
.history-toggle.active { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }

.history-panel {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  border-radius: 6px;
  margin-bottom: 0;
}

  max-height: 600px;
  margin-bottom: 16px;
  overflow-y: auto;
}

  padding: 14px 18px;
}
.history-table {

  border-collapse: collapse;

}

}

.history-table td {
  padding: 5px 10px;
  border-bottom: 1px solid var(--table-border);

}
.history-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
.history-table tr:last-child td { border-bottom: none; }
.history-table tr:hover td { background: var(--table-hover); }
.history-pipeline-badge {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 8px;
  font-size: 10px;
  font-weight: 500;
  color: #fff;

}
.history-pipeline-genes { background: #6f42c1; }

/* Score progress bar */
.score-bar-container {

/* Sidebar toggle */
.sidebar-toggle {

/* Responsive */
@media (max-width: 768px) {

    display: none;

    width: 260px;

}
</style>
<script>
(function() {
  var pref = localStorage.getItem("theme");
  if (pref === "dark" || (!pref && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
    document.documentElement.classList.add("dark");

</script>
</head>
<body>

<div class="app">
  <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle navigation">&#9776;</button>
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Near-Miss Articles</h2>
      <input type="text" class="sidebar-search" id="sidebarSearch" placeholder="Search subcollections..." aria-label="Search subcollections">
    </div>
    <div class="sidebar-tree" id="sidebarTree"></div>
    <div class="tuning-panel" id="tuningPanel">
      <div class="tuning-header" role="button" tabindex="0" aria-label="Toggle threshold tuning panel" onclick="window.__toggleTuning()">
        <span class="arrow" id="tuningArrow">&#9654;</span>
        <span>Threshold Tuning</span>
      </div>
      <div class="tuning-body" id="tuningBody">
        <div id="tuningContent">
          <div class="tuning-disabled">Select a subcollection to tune thresholds.</div>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div id="metaBar" class="meta-bar"></div>
    <div class="stats-panel" id="statsPanel">
      <div class="stats-panel-inner" id="statsPanelContent"></div>
    </div>
    <div class="history-panel" id="historyPanel">
      <div class="history-panel-inner" id="historyPanelContent"></div>
    </div>
    <div class="recent-panel" id="recentPanel">
      <div class="recent-panel-inner" id="recentPanelContent"></div>
    </div>

    <div id="rescueBar"></div>

    <div class="main-header">
      <div>
        <div class="main-title" id="mainTitle">Select a subcollection</div>
        <div class="main-subtitle" id="mainSubtitle"></div>
      </div>
      <div class="main-controls">
        <select class="filter-select" id="reasonFilter" aria-label="Filter by reason">
          <option value="all">All reasons</option>
          <option value="score_below_threshold" selected>Score below threshold</option>
          <option value="text_exclusion">Text exclusion</option>
          <option value="mesh_exclusion">MeSH exclusion</option>
          <option value="mention_filter">Mention filter</option>
        </select>
        <select class="filter-select" id="sortSelect" aria-label="Sort articles">
          <option value="cited_desc">Most cited</option>
          <option value="shared_desc">Most shared</option>
          <option value="recurring_desc">Most recurring</option>
          <option value="year_desc">Newest first</option>
          <option value="first_seen_desc">Recently added</option>
          <option value="closest_desc">Closest to threshold</option>
        </select>
        <label class="recurring-toggle"><input type="checkbox" id="recurringOnly"> Recurring only</label>
        <div class="selection-controls">
          <label><input type="checkbox" id="selectAll"> All on page</label>
          <span id="selectedCount">0 selected</span>
        </div>
        <button class="btn btn-primary" id="exportBtn" disabled>Export BibTeX</button>
      </div>
    </div>

    <div id="content">
      <div class="empty-state">
        <h3>Choose a subcollection from the sidebar</h3>
        <p>Browse genes and topic categories to review near-miss articles.</p>
      </div>
    </div>

    <div class="pagination" id="pagination"></div>
  </main>
</div>

<script>
(function() {
  "use strict";

  const PAGE_SIZE = 50;
  let data = null;
  let runHistory = null;
  let recentAdditions = null;
  let rescueQueue = loadRescueQueue();
  let currentSubcollection = null;
  let currentCategory = null;
  let currentPage = 1;
  let currentReason = "score_below_threshold";
  let currentSort = "cited_desc";
  let sortColumn = "cited";
  let sortDirection = "desc";
  let recurringOnly = false;
  let selectedPmids = new Set();
  let filteredArticles = [];
  let azFilter = "";
  let tuningThreshold = null;  // null = no override, number = custom threshold

  // ------------------------------------------------------------------
  // Rescue queue (localStorage-based)
  // ------------------------------------------------------------------

  function loadRescueQueue() {
    try {
      var raw = localStorage.getItem("rescueQueue");
      if (raw) return JSON.parse(raw);
    } catch (e) { /* ignore */ }
    return {};
  }

  function saveRescueQueue() {
    try {
      localStorage.setItem("rescueQueue", JSON.stringify(rescueQueue));
    } catch (e) {
      // QuotaExceededError or SecurityError (private browsing)
      console.warn("Could not save rescue queue to localStorage:", e);
    }
  }

  function isInRescueQueue(article) {
    var key = rescueKey(article);
    return key ? !!rescueQueue[key] : false;
  }

  function rescueKey(article) {
    if (article.pmid) return "pmid:" + article.pmid;
    if (article.doi) return "doi:" + article.doi;
    return null;
  }

  window.__rescueArticle = function(pmid, doi) {
    if (!data || !data.articles) return;
    var article = data.articles.find(function(a) {
      return (pmid && a.pmid === pmid) || (doi && a.doi === doi);
    });
    if (!article) return;
    var key = rescueKey(article);
    if (!key || rescueQueue[key]) return;
    rescueQueue[key] = {
      pmid: article.pmid || "",
      doi: article.doi || "",
      title: article.title || "",
      subcollection: article.subcollection || "",
      category: article.category || "",
      rescued_at: new Date().toISOString(),
    };
    saveRescueQueue();
    renderRescueBar();
    renderArticles();
  };

  window.__unrescueArticle = function(pmid, doi) {
    var key = pmid ? "pmid:" + pmid : (doi ? "doi:" + doi : null);
    if (!key || !rescueQueue[key]) return;
    delete rescueQueue[key];
    saveRescueQueue();
    renderRescueBar();
    renderArticles();
  };

  window.__exportRescueQueue = function() {
    var entries = Object.values(rescueQueue);
    if (entries.length === 0) return;
    var output = JSON.stringify(entries, null, 2);
    var blob = new Blob([output], { type: "application/json;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "rescue_queue.json";
    a.click();
    URL.revokeObjectURL(url);
  };

  window.__clearRescueQueue = function() {
    rescueQueue = {};
    saveRescueQueue();
    renderRescueBar();
    renderArticles();
  };

  function renderRescueBar() {
    var bar = document.getElementById("rescueBar");
    var count = Object.keys(rescueQueue).length;
    if (count === 0) {
      bar.innerHTML = "";
      return;
    }
    var html = '<div class="rescue-export-bar">';
    html += '<span class="rescue-count">' + count + '</span> article' + (count !== 1 ? 's' : '') + ' in rescue queue';
    html += ' <button class="btn" onclick="window.__exportRescueQueue()">Download rescue_queue.json</button>';
    html += ' <button class="btn" onclick="window.__clearRescueQueue()" style="color:var(--badge-text)">Clear</button>';
    html += '</div>';
    bar.innerHTML = html;
  }

  // ------------------------------------------------------------------
  // Data loading
  // ------------------------------------------------------------------

  async function loadData() {
    const content = document.getElementById("content");
    content.innerHTML = '<div class="loading">Loading data...</div>';
    try {
      const resp = await fetch("data/near_misses.json");
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      data = await resp.json();
      renderSidebar();
      renderMetaBar();
      renderRescueBar();
      content.innerHTML =
        '<div class="empty-state"><h3>Choose a subcollection from the sidebar</h3>' +
        '<p>Browse genes and topic categories to review near-miss articles.</p></div>';
    } catch (e) {
      content.innerHTML =
        '<div class="empty-state"><h3>Could not load data</h3>' +
        '<p>Ensure data/near_misses.json exists. Run the pipeline first.</p>' +
        '<p style="font-size:12px;margin-top:8px">' + escapeHtml(e.message) + '</p></div>';
    }
  }

  // ------------------------------------------------------------------
  // Sidebar
  // ------------------------------------------------------------------

  function renderSidebar() {
    const tree = document.getElementById("sidebarTree");
    if (!data || !data.hierarchy) { tree.innerHTML = ""; return; }

    // Count articles per subcollection per reason
    const counts = {};
    for (const a of data.articles) {
      const key = a.category + "/" + a.subcollection;
      counts[key] = (counts[key] || 0) + 1;
    }

    // Count shared articles (subcollection contains a comma)
    let sharedCount = 0;
    for (const a of data.articles) {
      if ((a.subcollection || "").includes(",")) sharedCount++;
    }

    let html = "";

    // Shared near-misses entry at top of sidebar
    if (sharedCount > 0) {
      html += '<div class="shared-item" id="sharedItem" role="button" tabindex="0" onclick="window.__selectShared()">';
      html += '<span>Shared Near-Misses</span>';
      html += '<span class="count">' + sharedCount + '</span>';
      html += '</div>';
      html += '<hr class="shared-separator">';
    }

    const sortedCats = Object.keys(data.hierarchy).sort();

    for (const cat of sortedCats) {
      const subs = data.hierarchy[cat];
      const isGenes = cat === "6 - Genes";
      let catCount = 0;
      for (const sub of subs) catCount += counts[cat + "/" + sub] || 0;

      html += '<div class="tree-category" data-cat="' + escapeAttr(cat) + '">';
      html += '<div class="tree-category-header" onclick="window.__toggleCat(this)">';
      html += '<span class="arrow">&#9654;</span>';
      html += '<span>' + escapeHtml(cat) + '</span>';
      html += '<span class="count">' + catCount + '</span>';
      html += '</div>';
      html += '<div class="tree-children">';

      if (isGenes && subs.length > 20) {
        html += '<div class="az-filter" id="azFilter">';
        const letters = new Set(subs.map(s => (s[0] || "").toUpperCase()));
        for (const l of [...letters].sort()) {
          html += '<button class="az-btn" onclick="window.__azFilter(\'' + l + '\')">' + l + '</button>';
        }
        html += '<button class="az-btn" onclick="window.__azFilter(\'\')">All</button>';
        html += '</div>';
      }

      for (const sub of subs) {
        const c = counts[cat + "/" + sub] || 0;
        html += '<div class="tree-item" role="button" tabindex="0" data-sub="' + escapeAttr(sub) + '" data-cat="' + escapeAttr(cat) + '" ';
        html += 'onclick="window.__selectSub(\'' + escapeInlineHandler(cat) + "','" + escapeInlineHandler(sub) + '\')">';
        html += '<span class="name">' + escapeHtml(sub) + '</span>';
        html += '<span class="count">' + c + '</span>';
        html += '</div>';
      }

      html += '</div></div>';
    }
    tree.innerHTML = html;

    document.querySelectorAll(".tree-item, .tree-category-header, .shared-item").forEach(function(el) {
      el.addEventListener("keydown", function(e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          el.click();
        }
      });
    });
  }

  function filterSidebar(query) {
    const items = document.querySelectorAll(".tree-item");
    const cats = document.querySelectorAll(".tree-category");
    const q = query.toLowerCase().trim();

    if (!q && !azFilter) {
      items.forEach(el => el.style.display = "");
      return;
    }

    const visibleCats = new Set();
    items.forEach(el => {
      const sub = (el.dataset.sub || "").toLowerCase();
      const cat = el.dataset.cat || "";
      const matchQ = !q || sub.includes(q);
      const matchAz = !azFilter || sub[0] === azFilter.toLowerCase();
      if (matchQ && matchAz) {
        el.style.display = "";
        visibleCats.add(cat);
      } else {
        el.style.display = "none";
      }
    });

    // Auto-open categories with matches
    if (q) {
      cats.forEach(el => {
        const cat = el.dataset.cat;
        const children = el.querySelector(".tree-children");
        const arrow = el.querySelector(".arrow");
        if (visibleCats.has(cat)) {
          children.classList.add("open");
          arrow.classList.add("open");
        }
      });
    }
  }

  window.__toggleCat = function(header) {
    const children = header.nextElementSibling;
    const arrow = header.querySelector(".arrow");
    children.classList.toggle("open");
    arrow.classList.toggle("open");
  };

  window.__azFilter = function(letter) {
    azFilter = letter;
    document.querySelectorAll(".az-btn").forEach(b => {
      b.classList.toggle("active", b.textContent === letter || (!letter && b.textContent === "All"));
    });
    filterSidebar(document.getElementById("sidebarSearch").value);
  };

  window.__selectSub = function(cat, sub) {
    currentCategory = cat;
    currentSubcollection = sub;
    currentPage = 1;
    tuningThreshold = null;
    selectedPmids.clear();
    updateSelectAllCheckbox();
    updateSelectedCount();

    // Highlight active
    document.querySelectorAll(".tree-item").forEach(el => {
      el.classList.toggle("active", el.dataset.sub === sub && el.dataset.cat === cat);
    });
    var sharedEl = document.getElementById("sharedItem");
    if (sharedEl) sharedEl.classList.remove("active");

    renderArticles();
  };

  window.__selectShared = function() {
    currentCategory = "__shared__";
    currentSubcollection = "__shared__";
    currentPage = 1;
    tuningThreshold = null;
    selectedPmids.clear();
    updateSelectAllCheckbox();
    updateSelectedCount();

    // Default to "Most shared" sort
    currentSort = "shared_desc";
    sortColumn = "subs";
    sortDirection = "desc";
    document.getElementById("sortSelect").value = "shared_desc";

    // Highlight shared item, clear tree items
    document.querySelectorAll(".tree-item").forEach(el => el.classList.remove("active"));
    var sharedEl = document.getElementById("sharedItem");
    if (sharedEl) sharedEl.classList.add("active");

    renderArticles();
  };

  // ------------------------------------------------------------------
  // Articles rendering
  // ------------------------------------------------------------------

  function sortActiveClass(col) {
    return sortColumn === col ? " sort-active" : "";
  }

  function sortArrow(col) {
    if (sortColumn !== col) return '<span class="sort-arrow">&#9650;</span>';
    return '<span class="sort-arrow">' + (sortDirection === "asc" ? "&#9650;" : "&#9660;") + '</span>';
  }

  window.__sortBy = function(col) {
    if (sortColumn === col) {
      sortDirection = sortDirection === "desc" ? "asc" : "desc";
    } else {
      sortColumn = col;
      // Default direction: desc for numeric columns, asc for text
      sortDirection = (col === "cited" || col === "year" || col === "score" || col === "subs") ? "desc" : "asc";
    }
    // Sync the dropdown to reflect column sorting
    currentSort = sortColumn + "_" + sortDirection;
    var sel = document.getElementById("sortSelect");
    // Set dropdown to matching value if it exists, otherwise clear
    var matchVal = null;
    for (var i = 0; i < sel.options.length; i++) {
      if (sel.options[i].value === currentSort) { matchVal = currentSort; break; }
    }
    sel.value = matchVal || "";
    currentPage = 1;
    renderArticles();
  };

  function getSubCount(a) {
    return (a.subcollection || "").split(",").map(s => s.trim()).filter(Boolean).length;
  }

  function getFilteredArticles() {
    if (!data || !currentSubcollection) return [];

    let result;
    if (currentSubcollection === "__shared__") {
      result = data.articles.filter(a => {
        if (getSubCount(a) <= 1) return false;
        if (currentReason !== "all" && a.reason !== currentReason) return false;
        if (recurringOnly && (a.seen_count || 1) <= 1) return false;
        return true;
      });
    } else {
      result = data.articles.filter(a => {
        // Handle comma-separated subcollection/category from merged entries
        const subs = (a.subcollection || "").split(",").map(s => s.trim());
        const cats = (a.category || "").split(",").map(s => s.trim());
        if (!subs.includes(currentSubcollection)) return false;
        if (!cats.includes(currentCategory)) return false;
        if (currentReason !== "all" && a.reason !== currentReason) return false;
        if (recurringOnly && (a.seen_count || 1) <= 1) return false;
        return true;
      });
    }

    // Sort
    var dir = sortDirection === "asc" ? 1 : -1;
    result.sort((a, b) => {
      // Special dropdown-only sorts
      if (currentSort === "shared_desc") {
        var diff = getSubCount(b) - getSubCount(a);
        return diff || ((b.cited_by_count || 0) - (a.cited_by_count || 0));
      }
      if (currentSort === "recurring_desc") {
        return ((b.seen_count || 1) - (a.seen_count || 1)) || ((b.cited_by_count || 0) - (a.cited_by_count || 0));
      }
      if (currentSort === "first_seen_desc") {
        return (b.first_seen || "").localeCompare(a.first_seen || "");
      }
      if (currentSort === "closest_desc") {
        var ratioA = (a.effective_score || 0) / (a.threshold || 1);
        var ratioB = (b.effective_score || 0) / (b.threshold || 1);
        return ratioB - ratioA || ((b.cited_by_count || 0) - (a.cited_by_count || 0));
      }
      // Column-based sorting
      switch (sortColumn) {
        case "title":
          return dir * (a.title || "").localeCompare(b.title || "");
        case "reason":
          return dir * (a.reason || "").localeCompare(b.reason || "");
        case "score":
          return dir * ((a.effective_score || 0) - (b.effective_score || 0));
        case "subs":
          var d = dir * (getSubCount(a) - getSubCount(b));
          return d || ((b.cited_by_count || 0) - (a.cited_by_count || 0));
        case "year":
          return dir * ((Number(a.year) || 0) - (Number(b.year) || 0));
        case "cited":
        default:
          return dir * ((a.cited_by_count || 0) - (b.cited_by_count || 0));
      }
    });
    return result;
  }

  function renderArticles() {
    filteredArticles = getFilteredArticles();
    const totalPages = Math.max(1, Math.ceil(filteredArticles.length / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;

    const start = (currentPage - 1) * PAGE_SIZE;
    const page = filteredArticles.slice(start, start + PAGE_SIZE);

    var isShared = currentSubcollection === "__shared__";
    document.getElementById("mainTitle").textContent = isShared ? "Shared Near-Misses" : (currentSubcollection || "Select a subcollection");
    document.getElementById("mainSubtitle").textContent = isShared
      ? filteredArticles.length + " article" + (filteredArticles.length !== 1 ? "s" : "") + " appearing in 2+ subcollections"
      : filteredArticles.length + " article" + (filteredArticles.length !== 1 ? "s" : "") +
        (currentReason !== "all" ? " (" + reasonLabel(currentReason) + ")" : "");

    renderTuningPanel();

    if (page.length === 0) {
      document.getElementById("content").innerHTML =
        '<div class="empty-state"><h3>No articles</h3>' +
        '<p>No near-miss articles for this subcollection with the selected filter.</p></div>';
      document.getElementById("pagination").innerHTML = "";
      return;
    }

    let html = '<table class="article-table">';
    html += '<thead><tr>';
    html += '<th class="col-check"></th>';
    html += '<th class="sortable' + sortActiveClass("title") + '" onclick="window.__sortBy(\'title\')">';
    html += 'Article' + sortArrow("title") + '</th>';
    html += '<th class="col-reason sortable' + sortActiveClass("reason") + '" onclick="window.__sortBy(\'reason\')">';
    html += 'Reason' + sortArrow("reason") + '</th>';
    if (isShared) {
      html += '<th class="col-subs sortable' + sortActiveClass("subs") + '" onclick="window.__sortBy(\'subs\')">';
      html += 'Subs' + sortArrow("subs") + '</th>';
    }
    html += '<th class="col-score sortable' + sortActiveClass("score") + '" onclick="window.__sortBy(\'score\')">';
    html += 'Score' + sortArrow("score") + '</th>';
    html += '<th class="col-cited sortable' + sortActiveClass("cited") + '" onclick="window.__sortBy(\'cited\')">';
    html += 'Cited' + sortArrow("cited") + '</th>';
    html += '<th class="col-year sortable' + sortActiveClass("year") + '" onclick="window.__sortBy(\'year\')">';
    html += 'Year' + sortArrow("year") + '</th>';
    html += '<th class="col-rescue">Rescue</th>';
    html += '</tr></thead><tbody>';

    for (const a of page) {
      const pmid = a.pmid || "";
      const checked = selectedPmids.has(pmid) ? " checked" : "";
      const pubmedUrl = pmid ? "https://pubmed.ncbi.nlm.nih.gov/" + pmid : "#";
      const authors = formatAuthors(a.authors);
      const hasAbstract = a.abstract && a.abstract.length > 0;
      const abstractId = "abs-" + pmid;
      const articleRescued = isRescued(a);

      var isTextExcl = a.reason === "text_exclusion" && a.matched_term;
      var isMeshExcl = a.reason === "mesh_exclusion" && a.matched_term;
      var titleHtml = isTextExcl
        ? highlightTerm(a.title || "Untitled", a.matched_term)
        : escapeHtml(a.title || "Untitled");

      html += '<tr' + (articleRescued ? ' class="rescued"' : '') + '>';
      html += '<td class="col-check"><input type="checkbox" data-pmid="' + escapeAttr(pmid) + '"' + checked + ' onchange="window.__toggleSelect(this)"></td>';
      html += "<td>";
      html += '<div class="article-title"><a href="' + escapeAttr(pubmedUrl) + '" target="_blank" rel="noopener">' + titleHtml + '</a></div>';
      html += '<div class="article-meta">' + escapeHtml(authors) + " &mdash; " + escapeHtml(a.journal || "") + "</div>";
      if (hasAbstract) {
        var abstractHtml = isTextExcl
          ? highlightTerm(a.abstract, a.matched_term)
          : escapeHtml(a.abstract);
        html += '<button class="abstract-toggle" onclick="window.__toggleAbstract(\'' + escapeInlineHandler(abstractId) + '\')">Show abstract</button>';
        html += '<div class="abstract-text" id="' + abstractId + '">' + abstractHtml + '</div>';
      }
      html += "</td>";
      html += '<td class="col-reason">';
      html += reasonBadge(a.reason);
      if ((a.seen_count || 1) > 1) {
        html += '<span class="badge badge-recurring" title="Seen in ' + a.seen_count + ' pipeline runs">x' + a.seen_count + '</span>';
      }
      if (a.matched_term && isMeshExcl) {
        html += '<div><span class="mesh-trigger-tag">' + escapeHtml(a.matched_term) + '</span></div>';
      } else if (a.matched_term) {
        html += '<div class="matched-term">"' + escapeHtml(a.matched_term) + '"</div>';
      }
      if (a.first_seen) {
        const fsDate = new Date(a.first_seen).toLocaleDateString();
        let dateTitle = "First seen: " + fsDate;
        if (a.last_seen) dateTitle += " | Last seen: " + new Date(a.last_seen).toLocaleDateString();
        html += '<div class="first-seen" title="' + escapeAttr(dateTitle) + '">Since ' + fsDate + '</div>';
      }
      html += "</td>";
      if (isShared) {
        html += '<td class="col-subs"><div class="sub-badges">';
        var subs = (a.subcollection || "").split(",").map(function(s) { return s.trim(); });
        var cats = (a.category || "").split(",").map(function(s) { return s.trim(); });
        for (var si = 0; si < subs.length; si++) {
          var isGene = (cats[si] || "").indexOf("Genes") !== -1;
          html += '<span class="sub-badge ' + (isGene ? "sub-badge-gene" : "sub-badge-topic") + '">' + escapeHtml(subs[si]) + '</span>';
        }
        html += '</div></td>';
      }
      html += '<td class="col-score" style="text-align:right">';
      if (a.reason === "score_below_threshold" && a.effective_score != null) {
        var displayThreshold = tuningThreshold != null ? tuningThreshold : (a.threshold || 1);
        var ratio = displayThreshold > 0 ? (a.effective_score / displayThreshold) : 0;
        var barPct = Math.min(ratio * 100, 100);
        var barClass = ratio < 0.5 ? "score-low" : (ratio < 0.8 ? "score-mid" : "score-high");
        html += '<div class="score-bar-container">';
        html += '<div class="score-bar-fill ' + barClass + '" style="width:' + barPct.toFixed(1) + '%"></div>';
        html += '<span class="score-bar-label">' + a.effective_score + ' / ' + displayThreshold + '</span>';
        html += '</div>';
        if (articleRescued) html += '<span class="rescued-badge">PASS</span>';
        const parts = [];
        if (a.co_citations != null) parts.push("co:" + a.co_citations);
        if (a.bib_coupling != null) parts.push("bib:" + a.bib_coupling);
        if (a.recency_bonus != null) parts.push("rec:+" + a.recency_bonus);
        if (a.direction) parts.push(a.direction);
        if (parts.length) html += '<div class="score-detail">' + escapeHtml(parts.join(" ")) + '</div>';
      } else {
        html += '<span style="color:var(--text-secondary)">-</span>';
      }
      html += "</td>";
      html += '<td class="col-cited" style="text-align:right">' + (a.cited_by_count || 0) + "</td>";
      html += '<td class="col-year">' + escapeHtml(a.year || "") + "</td>";
      var inQueue = isInRescueQueue(a);
      html += '<td class="col-rescue">';
      if (inQueue) {
        html += '<button class="rescue-btn rescued" onclick="window.__unrescueArticle(\'' + escapeInlineHandler(pmid) + "','" + escapeInlineHandler(a.doi || "") + '\')" title="Remove from rescue queue">Queued</button>';
      } else {
        html += '<button class="rescue-btn" onclick="window.__rescueArticle(\'' + escapeInlineHandler(pmid) + "','" + escapeInlineHandler(a.doi || "") + '\')" title="Add to rescue queue">Rescue</button>';
      }
      html += "</td>";
      html += "</tr>";
    }
    html += "</tbody></table>";
    document.getElementById("content").innerHTML = html;

    renderPagination(totalPages);
  }

  function renderPagination(totalPages) {
    if (totalPages <= 1) {
      document.getElementById("pagination").innerHTML = "";
      return;
    }
    let html = '<button class="page-btn" onclick="window.__goPage(' + (currentPage - 1) + ')"' +
      (currentPage <= 1 ? " disabled" : "") + '>&laquo; Prev</button>';

    const maxButtons = 7;
    let startP = Math.max(1, currentPage - Math.floor(maxButtons / 2));
    let endP = Math.min(totalPages, startP + maxButtons - 1);
    if (endP - startP < maxButtons - 1) startP = Math.max(1, endP - maxButtons + 1);

    if (startP > 1) {
      html += '<button class="page-btn" onclick="window.__goPage(1)">1</button>';
      if (startP > 2) html += '<span class="page-info">...</span>';
    }
    for (let p = startP; p <= endP; p++) {
      html += '<button class="page-btn' + (p === currentPage ? " active" : "") +
        '" onclick="window.__goPage(' + p + ')">' + p + '</button>';
    }
    if (endP < totalPages) {
      if (endP < totalPages - 1) html += '<span class="page-info">...</span>';
      html += '<button class="page-btn" onclick="window.__goPage(' + totalPages + ')">' + totalPages + '</button>';
    }

    html += '<button class="page-btn" onclick="window.__goPage(' + (currentPage + 1) + ')"' +
      (currentPage >= totalPages ? " disabled" : "") + '>Next &raquo;</button>';

    document.getElementById("pagination").innerHTML = html;
  }

  window.__goPage = function(p) {
    const totalPages = Math.max(1, Math.ceil(filteredArticles.length / PAGE_SIZE));
    if (p < 1 || p > totalPages) return;
    currentPage = p;
    renderArticles();
    window.scrollTo(0, 0);
  };

    const bibtex = articles.map(toBibtex).join("\n\n");

  function escapeLatex(s) {
    if (!s) return "";
    s = s.replace(/\\/g, "\\textbackslash{}");
    return s.replace(/([#$%&_{}~^])/g, "\\$1");
  }

  function toBibtex(article) {
    const lastAuthor = (article.authors && article.authors.length > 0)
      ? (article.authors[0][1] || "Unknown") : "Unknown";
    const cleanLast = lastAuthor.replace(/[^a-zA-Z]/g, "");
    const id = cleanLast + (article.year || "") + "_" + (article.pmid || "");
    const authorStr = (article.authors || [])
      .map(a => escapeLatex((a[1] || "") + ", " + (a[0] || "")))
      .join(" and ");
    const title = escapeLatex((article.title || "").replace(/[{}]/g, ""));
    const journal = escapeLatex(article.journal || "");
    const lines = [
      "@article{" + id + ",",
      "  title = {" + title + "},",
      "  author = {" + authorStr + "},",
      "  journal = {" + journal + "},",
      "  year = {" + (article.year || "") + "},"
    ];
    if (article.doi) lines.push("  doi = {" + escapeLatex(article.doi) + "},");
    if (article.pmid) lines.push("  pmid = {" + article.pmid + "},");
    lines.push("}");
    return lines.join("\n");
  }

  function formatAuthors(authors) {
    if (!authors || authors.length === 0) return "Unknown";
    const fmt = a => (a[1] || "") + " " + ((a[0] || "").charAt(0) || "");
    if (authors.length <= 3) return authors.map(fmt).join(", ");
    return fmt(authors[0]) + ", " + fmt(authors[1]) + ", et al.";
  }

  function reasonLabel(reason) {
    const labels = {
      score_below_threshold: "Score below threshold",
      text_exclusion: "Text exclusion",
      mesh_exclusion: "MeSH exclusion",
      mention_filter: "Mention filter",
    };
    return labels[reason] || reason;
  }

  function reasonBadge(reason) {
    const cls = {
      score_below_threshold: "badge-score",
      text_exclusion: "badge-text",
      mesh_exclusion: "badge-mesh",
      mention_filter: "badge-mention",
    };
    return '<span class="badge ' + (cls[reason] || "badge-mention") + '">' + reasonLabel(reason) + '</span>';
  }

  function renderStatsPanel() {
    if (!data || !data.articles) return;
    var container = document.getElementById("statsPanelContent");
    var articles = data.articles;
    var total = articles.length;

    // Breakdown by reason
    var reasons = {};
    var reasonKeys = ["score_below_threshold", "text_exclusion", "mesh_exclusion", "mention_filter"];
    for (var i = 0; i < reasonKeys.length; i++) reasons[reasonKeys[i]] = 0;
    for (var j = 0; j < articles.length; j++) {
      var r = articles[j].reason || "unknown";
      reasons[r] = (reasons[r] || 0) + 1;
    }
    var maxReasonCount = 0;
    for (var k = 0; k < reasonKeys.length; k++) {
      if (reasons[reasonKeys[k]] > maxReasonCount) maxReasonCount = reasons[reasonKeys[k]];
    }

    // Top subcollections
    var subCounts = {};
    for (var m = 0; m < articles.length; m++) {
      var subs = (articles[m].subcollection || "").split(",").map(function(s) { return s.trim(); });
      for (var n = 0; n < subs.length; n++) {
        if (subs[n]) subCounts[subs[n]] = (subCounts[subs[n]] || 0) + 1;
      }
    }
    var topSubs = Object.keys(subCounts).map(function(s) { return { name: s, count: subCounts[s] }; });
    topSubs.sort(function(a, b) { return b.count - a.count; });
    topSubs = topSubs.slice(0, 5);
    var maxSubCount = topSubs.length > 0 ? topSubs[0].count : 1;

    var reasonFillClass = {
      score_below_threshold: "fill-score",
      text_exclusion: "fill-text",
      mesh_exclusion: "fill-mesh",
      mention_filter: "fill-mention"
    };

    var html = '<div class="stats-grid">';
    // Left: big numbers
    html += '<div class="stats-summary">';
    html += '<div class="stats-big-number">' + total + '</div>';
    html += '<div class="stats-label">total rejections</div>';
    if (data.pipeline_runs) {
      html += '<div style="margin-top:8px"><span style="font-size:20px;font-weight:700">' + data.pipeline_runs + '</span></div>';
      html += '<div class="stats-label">pipeline runs</div>';
    }
    html += '</div>';

    // Right: breakdown bars
    html += '<div class="stats-breakdown">';
    html += '<div class="stats-breakdown-title">By reason</div>';
    for (var ri = 0; ri < reasonKeys.length; ri++) {
      var rk = reasonKeys[ri];
      var rc = reasons[rk] || 0;
      var pct = maxReasonCount > 0 ? (rc / maxReasonCount * 100) : 0;
      html += '<div class="stats-bar-row">';
      html += '<span class="stats-bar-label">' + reasonLabel(rk) + '</span>';
      html += '<div class="stats-bar-track"><div class="stats-bar-fill ' + (reasonFillClass[rk] || '') + '" style="width:' + pct.toFixed(1) + '%"></div></div>';
      html += '<span class="stats-bar-count">' + rc + '</span>';
      html += '</div>';
    }
    html += '</div>';
    html += '</div>';

    // Bottom: top subcollections
    if (topSubs.length > 0) {
      html += '<div class="stats-top-subs">';
      html += '<div class="stats-top-subs-title">Top subcollections</div>';
      for (var si = 0; si < topSubs.length; si++) {
        var sp = maxSubCount > 0 ? (topSubs[si].count / maxSubCount * 100) : 0;
        html += '<div class="stats-sub-row">';
        html += '<span class="stats-sub-name" title="' + escapeAttr(topSubs[si].name) + '">' + escapeHtml(topSubs[si].name) + '</span>';
        html += '<div class="stats-sub-bar"><div class="stats-sub-fill" style="width:' + sp.toFixed(1) + '%"></div></div>';
        html += '<span class="stats-sub-count">' + topSubs[si].count + '</span>';
        html += '</div>';
      }
      html += '</div>';
    }

    container.innerHTML = html;
  }

  function renderRunHistoryPanel() {
    var container = document.getElementById("historyPanelContent");
    if (!runHistory || !runHistory.runs || runHistory.runs.length === 0) {
      container.innerHTML = '<div class="history-empty">No run history available yet.</div>';
      return;
    }

    // Show runs newest-first
    var runs = runHistory.runs.slice().reverse();

    var html = '<table class="history-table">';
    html += '<thead><tr>';
    html += '<th>Date</th>';
    html += '<th>Pipelines</th>';
    html += '<th class="num">Found</th>';
    html += '<th class="num">New</th>';
    html += '<th class="num">Uploaded</th>';
    html += '<th class="num">Failed</th>';
    html += '<th class="num">API Errors</th>';
    html += '</tr></thead>';
    html += '<tbody>';

    for (var i = 0; i < runs.length; i++) {
      var run = runs[i];
      var dt = run.timestamp ? new Date(run.timestamp).toLocaleString() : "unknown";
      var gt = (run.genes && run.genes.totals) || {};
      var tt = (run.topics && run.topics.totals) || {};
      var pipes = run.pipelines || {};

      var found = (gt.found || 0) + (tt.found || 0);
      var newCount = (gt["new"] || 0) + (tt["new"] || 0);
      var uploaded = (gt.added || 0) + (gt.cit_added || 0) + (gt.recent_added || 0)
                   + (tt.added || 0) + (tt.cit_added || 0) + (tt.recent_added || 0);
      var failed = (gt.failed || 0) + (tt.failed || 0);
      var apiErrors = run.openalex_failed_requests || 0;

      var pipeHtml = '';
      if (pipes.genes) pipeHtml += '<span class="history-pipeline-badge history-pipeline-genes">Genes</span>';
      if (pipes.topics) pipeHtml += '<span class="history-pipeline-badge history-pipeline-topics">Topics</span>';
      if (!pipeHtml) pipeHtml = '<span style="color:var(--text-secondary)">--</span>';

      html += '<tr>';
      html += '<td>' + escapeHtml(dt) + '</td>';
      html += '<td>' + pipeHtml + '</td>';
      html += '<td class="num">' + found + '</td>';
      html += '<td class="num">' + newCount + '</td>';
      html += '<td class="num">' + uploaded + '</td>';
      html += '<td class="num">' + failed + '</td>';
      html += '<td class="num">' + (apiErrors > 0 ? '<span class="history-errors">' + apiErrors + '</span>' : '0') + '</td>';
      html += '</tr>';
    }

    html += '</tbody></table>';
    container.innerHTML = html;

  async function loadRecentAdditions() {

  function renderRecentPanel() {
    var container = document.getElementById("recentPanelContent");
    if (!recentAdditions || !recentAdditions.additions || recentAdditions.additions.length === 0) {
      container.innerHTML = '<div class="recent-empty">No recent additions recorded yet.</div>';
      return;
    }

    // Filter to last 4 weeks
    var cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 28);
    var cutoffISO = cutoff.toISOString();

    var recent = recentAdditions.additions.filter(function(a) {
      return (a.uploaded_at || "") >= cutoffISO;
    });

    if (recent.length === 0) {
      container.innerHTML = '<div class="recent-empty">No papers uploaded in the last 4 weeks.</div>';
      return;
    }

    // Group by subcollection
    var groups = {};
    for (var i = 0; i < recent.length; i++) {
      var a = recent[i];
      var groupKey = a.subcollection || "Unknown";
      if (!groups[groupKey]) groups[groupKey] = [];
      groups[groupKey].push(a);
    }

    // Sort groups alphabetically
    var groupKeys = Object.keys(groups).sort();

    var sourceClass = {
      "source:search": "recent-source-search",
      "source:citation": "recent-source-citation",
      "source:recent": "recent-source-recent",
      "source:rescue": "recent-source-rescue",
    };
    var sourceLabel = {
      "source:search": "search",
      "source:citation": "citation",
      "source:recent": "recent",
      "source:rescue": "rescue",
    };

    var html = '<div style="margin-bottom:8px;font-size:13px;color:var(--text-secondary)">' + recent.length + ' paper' + (recent.length !== 1 ? 's' : '') + ' uploaded in the last 4 weeks</div>';

    for (var gi = 0; gi < groupKeys.length; gi++) {
      var gk = groupKeys[gi];
      var items = groups[gk];
      // Sort by upload date descending
      items.sort(function(a, b) { return (b.uploaded_at || "").localeCompare(a.uploaded_at || ""); });

      html += '<div class="recent-group-header">' + escapeHtml(gk) + '<span class="recent-group-count">(' + items.length + ')</span></div>';

      for (var ii = 0; ii < items.length; ii++) {
        var item = items[ii];
        var url = item.pmid ? "https://pubmed.ncbi.nlm.nih.gov/" + item.pmid : "#";
        var src = item.source || "";
        var srcCls = sourceClass[src] || "";
        var srcLbl = sourceLabel[src] || src.replace("source:", "");
        var dateStr = item.uploaded_at ? new Date(item.uploaded_at).toLocaleDateString() : "";

        html += '<div class="recent-item">';
        if (srcLbl) html += '<span class="recent-source-tag ' + srcCls + '">' + escapeHtml(srcLbl) + '</span>';
        html += '<a href="' + escapeAttr(url) + '" target="_blank" rel="noopener">' + escapeHtml(item.title || "Untitled") + '</a>';
        html += '<span class="recent-meta">' + escapeHtml(item.year || "") + (dateStr ? " | " + dateStr : "") + '</span>';
        html += '</div>';
      }
    }

    container.innerHTML = html;
  }

  function escapeHtml(s) {
    if (!s) return "";
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function escapeAttr(s) {
    if (!s) return "";
    return s.replace(/\\/g, "\\\\").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/'/g, "&#39;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function escapeInlineHandler(s) {
    // Escape for JS string literal (single-quoted) inside a double-quoted HTML attribute.
    // Step 1: JS string escaping (backslash, single quote, newlines).
    // Step 2: HTML attribute escaping (ampersand, angle brackets, double quote).
    // Unlike escapeAttr, this does NOT escape backslash at the HTML level
    // (to avoid double-escaping the JS escapes) and does NOT entity-encode
    // single quotes (which would be decoded back by the HTML parser, re-opening
    // the JS string breakout that escapeAttr fails to prevent).
    if (!s) return "";
    s = s.replace(/\\/g, "\\\\").replace(/'/g, "\\'").replace(/\n/g, "\\n").replace(/\r/g, "\\r");
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function highlightTerm(text, term) {
    if (!text || !term) return escapeHtml(text);
    var escaped = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    var re = new RegExp("(\\b" + escaped + "\\b)", "gi");
    var parts = text.split(re);
    var out = "";
    for (var i = 0; i < parts.length; i++) {
      if (re.test(parts[i])) {
        out += '<span class="trigger-mark">' + escapeHtml(parts[i]) + '</span>';
      } else {
        out += escapeHtml(parts[i]);
      }
      re.lastIndex = 0;
    }
    return out;
  }

  // ------------------------------------------------------------------
  // Threshold tuning panel
  // ------------------------------------------------------------------

  window.__toggleTuning = function() {
    var body = document.getElementById("tuningBody");
    var arrow = document.getElementById("tuningArrow");
    body.classList.toggle("open");
    arrow.classList.toggle("open");
  };

  document.querySelector(".tuning-header").addEventListener("keydown", function(e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); this.click(); }
  });

  function getSubcollectionThreshold() {
    if (!data || !currentSubcollection) return null;
    // Find the most common threshold among score_below_threshold articles in this subcollection
    var thresholds = {};
    var maxCount = 0;
    var bestThreshold = null;
    for (var i = 0; i < data.articles.length; i++) {
      var a = data.articles[i];
      if (a.reason !== "score_below_threshold") continue;
      var subs = (a.subcollection || "").split(",").map(function(s) { return s.trim(); });
      var cats = (a.category || "").split(",").map(function(s) { return s.trim(); });
      if (!subs.includes(currentSubcollection) || !cats.includes(currentCategory)) continue;
      if (a.threshold == null) continue;
      var t = a.threshold;
      thresholds[t] = (thresholds[t] || 0) + 1;
      if (thresholds[t] > maxCount) {
        maxCount = thresholds[t];
        bestThreshold = t;
      }
    }
    return bestThreshold;
  }

  function getScoreArticlesForSubcollection() {
    if (!data || !currentSubcollection) return [];
    return data.articles.filter(function(a) {
      if (a.reason !== "score_below_threshold") return false;
      var subs = (a.subcollection || "").split(",").map(function(s) { return s.trim(); });
      var cats = (a.category || "").split(",").map(function(s) { return s.trim(); });
      return subs.includes(currentSubcollection) && cats.includes(currentCategory);
    });
  }

  function renderTuningPanel() {
    var container = document.getElementById("tuningContent");
    if (!data || !currentSubcollection) {
      container.innerHTML = '<div class="tuning-disabled">Select a subcollection to tune thresholds.</div>';
      return;
    }
    if (currentSubcollection === "__shared__") {
      container.innerHTML = '<div class="tuning-disabled">Threshold tuning is per-subcollection. Select a specific gene or topic.</div>';
      return;
    }

    var scoreArticles = getScoreArticlesForSubcollection();
    if (scoreArticles.length === 0) {
      container.innerHTML = '<div class="tuning-disabled">No score-based rejections for this subcollection.</div>';
      return;
    }

    var currentThreshold = getSubcollectionThreshold();
    if (currentThreshold == null) {
      container.innerHTML = '<div class="tuning-disabled">No threshold data available.</div>';
      return;
    }

    // Find score range
    var maxScore = 0;
    for (var i = 0; i < scoreArticles.length; i++) {
      var s = scoreArticles[i].effective_score || 0;
      if (s > maxScore) maxScore = s;
    }
    var sliderMax = Math.max(currentThreshold + 2, maxScore + 1, 10);

    var sliderVal = tuningThreshold != null ? tuningThreshold : currentThreshold;
    var rescued = 0;
    for (var j = 0; j < scoreArticles.length; j++) {
      if ((scoreArticles[j].effective_score || 0) >= sliderVal) rescued++;
    }
    var isModified = tuningThreshold != null && tuningThreshold !== currentThreshold;

    var html = '';
    html += '<div class="tuning-row">';
    html += '<div class="tuning-label"><span>Threshold</span><strong>' + sliderVal + '</strong></div>';
    html += '<input type="range" class="tuning-slider" id="tuningSlider" min="0" max="' + sliderMax + '" step="1" value="' + sliderVal + '" oninput="window.__tuneThreshold(this.value)">';
    html += '<div class="tuning-label"><span>0</span><span>Current: ' + currentThreshold + '</span><span>' + sliderMax + '</span></div>';
    html += '</div>';

    html += '<div class="tuning-result">';
    if (isModified) {
      html += '<span class="rescued-count">' + rescued + '</span> of ' + scoreArticles.length + ' would pass';
      html += ' (threshold ' + currentThreshold + ' -> ' + sliderVal + ')';
    } else {
      html += scoreArticles.length + ' article' + (scoreArticles.length !== 1 ? 's' : '') + ' below threshold';
    }
    html += '</div>';

    if (isModified) {
      html += '<button class="tuning-reset" onclick="window.__resetTuning()">Reset to current (' + currentThreshold + ')</button>';
    }

    container.innerHTML = html;
  }

  window.__tuneThreshold = function(val) {
    tuningThreshold = parseInt(val, 10);
    renderTuningPanel();
    if (currentSubcollection) renderArticles();
  };

  window.__resetTuning = function() {
    tuningThreshold = null;
    renderTuningPanel();
    if (currentSubcollection) renderArticles();
  };

  function isRescued(article) {
    if (tuningThreshold == null) return false;
    if (article.reason !== "score_below_threshold") return false;
    var currentThreshold = article.threshold;
    if (currentThreshold == null) return false;
    // Rescued = was below original threshold but passes new threshold
    return (article.effective_score || 0) < currentThreshold && (article.effective_score || 0) >= tuningThreshold;
  }

  // ------------------------------------------------------------------
  // Init
  // ------------------------------------------------------------------

  document.getElementById("sidebarToggle").addEventListener("click", function() {
    document.querySelector(".sidebar").classList.toggle("open");
  });

  loadData();
  loadRunHistory();
  loadRecentAdditions();

})();
</script>
</body>
</html>
