name: Gene & Topic Literature Bot

on:
  schedule:
    - cron: '0 22 * * 6'  # every Saturday at 22:00 UTC (2h before OpenAlex daily reset)
  workflow_dispatch:       # manual trigger from GitHub UI
    inputs:
      mode:
        description: 'Pipeline mode'
        required: false
        type: choice
        options:
          - both
          - genes
          - topics
        default: both
      categories:
        description: 'Topic category to run (e.g. "1 - Anatomy"). Leave empty for all categories.'
        required: false
        type: string
      genes:
        description: 'Space-separated gene symbols (leave empty for defaults from genes.yml)'
        required: false
        type: string

jobs:
  update-library:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch previous data from gh-pages
        run: |
          mkdir -p data
          git fetch origin gh-pages --depth=1 || true
          git show origin/gh-pages:data/near_misses.json > data/previous_near_misses.json 2>/dev/null || echo '{}' > data/previous_near_misses.json
          git show origin/gh-pages:data/citation_cache.json > data/citation_cache.json 2>/dev/null || echo '{}' > data/citation_cache.json

      - name: Run bot
        timeout-minutes: 360
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_GROUP_ID: ${{ secrets.ZOTERO_GROUP_ID }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          INPUT_GENES: ${{ inputs.genes }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_CATEGORIES: ${{ inputs.categories }}
        run: python run.py

      - name: Prepare dashboard data
        id: prepare-data
        if: always()
        run: |
          mkdir -p site/data
          if [ -f data/near_misses.json ]; then
            cp data/near_misses.json site/data/
          else
            echo '{"generated_at":"","pipeline_version":"1.0","stats":{"total_rejections":0,"by_reason":{},"by_category":{}},"hierarchy":{},"articles":[]}' > site/data/near_misses.json
          fi
          if [ -f data/citation_cache.json ]; then
            cp data/citation_cache.json site/data/
          fi

      - name: Deploy dashboard to GitHub Pages
        if: always() && steps.prepare-data.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-logs-${{ github.run_id }}
          path: logs/
          retention-days: 30
