name: Inverse Bot

on:
  schedule:
    - cron: '0 2 * * 0'  # Sunday 02:00 UTC
  workflow_dispatch:      # manual trigger from GitHub UI

permissions:
  contents: write  # the single job runs the bot and pushes to gh-pages

jobs:
  inverse-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # bio_toolkit = shared lab toolkit (own public repo). Pinned to a commit
          # for reproducible CI; bump this SHA (or switch to @master to auto-track)
          # when the toolkit changes.
          pip install "bio_toolkit @ git+https://github.com/Hippolyte-Menou/bio_toolkit.git@a460173decd03ea0bc65dd2690f693210a2b2541"

      - name: Fetch previous data from gh-pages
        run: |
          mkdir -p data site/data
          git fetch origin gh-pages --depth=1 || true
          git show origin/gh-pages:data/citation_cache.json > data/citation_cache.json 2>/dev/null || echo '{}' > data/citation_cache.json
          git show origin/gh-pages:data/inverse_bot_whitelist.json > data/inverse_bot_whitelist.json 2>/dev/null || echo '{"dismissed":[]}' > data/inverse_bot_whitelist.json

      - name: Run inverse bot
        timeout-minutes: 110
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_GROUP_ID: ${{ secrets.ZOTERO_GROUP_ID }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python inverse_bot.py

      - name: Prepare dashboard data
        run: |
          mkdir -p site/data
          if [ -f site/data/flagged_papers.json ]; then
            echo "flagged_papers.json ready"
          fi
          if [ -f data/citation_cache.json ]; then
            cp data/citation_cache.json site/data/
          fi
          if [ -f data/inverse_bot_whitelist.json ]; then
            cp data/inverse_bot_whitelist.json site/data/
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inverse-bot-logs-${{ github.run_id }}
          path: logs/
          retention-days: 30
