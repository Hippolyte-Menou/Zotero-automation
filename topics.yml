# topics.yml
# Topic-based literature discovery for categories 1-5.
# Category 6 (Genes) is handled by genes.yml.
#
# Query strategy per category:
#   - Anatomy/Embryology/Physiology/Examinations: keyword search + OpenAlex
#     topic filter (ophthalmology subfield 2731) + type preference for reviews
#   - Pathologies: disease-name search within ophthalmology, clinical focus,
#     subcollections derived from disease_name_mapping.json MOC categories
#
# Deduplication: papers already in the Zotero library (from any source,
# including gene pipeline) are skipped by PMID. No true duplicates.

# ---------------------------------------------------------------------------
# Global settings
# ---------------------------------------------------------------------------

search:
  max_results: 50           # broader than gene searches
  recent_max_results: 5     # fewer recent papers per sub-topic
  type_filter: "review|article"   # default; overridable per sub-topic

citation_expansion:
  enabled: true
  max_seed_papers: 30       # lighter than genes (100)
  min_co_citations: 2       # higher floor -- topic papers are less interconnected
  max_min_co: 4             # lower cap than genes (6)
  max_hops: 1               # single hop only
  hop2_top_n: 5

# OpenAlex topic IDs for scoping
# These are combined with keyword searches to stay within ophthalmology
openalex_scoping:
  ophthalmology_subfield: 2731
  # Key topic IDs (can be OR'd in filters)
  retinal_disease: [T10250, T10170, T12599]          # glaucoma+retinal, retinal diseases, retinal+optic
  retinal_development: [T10691]                        # retinal development & disorders (mol bio subfield)
  photoreceptor_physiology: [T12236]                   # photoreceptor & optogenetics (neuroscience)
  imaging: [T11438]                                    # retinal imaging & analysis
  ocular_disease: [T11194]                             # ocular diseases & Behcet
  surgery: [T11291]                                    # intraocular surgery & lenses

# Shared exclusions (same as genes.yml -- oncology, cardio, metabolic)
default_exclusions_text:
  - cancer
  - tumor
  - tumour
  - carcinoma
  - metastasis
  - oncogene
  - oncology
  - malignant
  - lymphoma
  - leukemia
  - leukaemia
  - sarcoma
  - glioma
  - melanoma
  - adenocarcinoma
  - adenoma
  - chemotherapy
  - radiotherapy
  - immunotherapy
  - type 2 diabetes
  - myocardial infarction

default_exclusions_mesh:
  - Neoplasms
  - Carcinoma
  - Sarcoma
  - Lymphoma
  - Leukemia
  - Melanoma
  - Glioma
  - Adenocarcinoma
  - Diabetes Mellitus
  - Cardiovascular Diseases
  - Myocardial Infarction
  - Heart Failure
  - Hypertension
  - Atherosclerosis
  - Obesity
  - Alzheimer Disease

# ---------------------------------------------------------------------------
# Categories
# ---------------------------------------------------------------------------

